name: Build rtrs Linux CPython 3.13 wheel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out fork default branch
        uses: actions/checkout@v4

      - name: Check upstream rtrs version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import tomllib
          pkg = tomllib.loads(Path('Cargo.toml').read_text(encoding='utf-8'))
          version = pkg['package']['version']
          print('rtrs source version:', version)
          if version != '0.2.4':
              raise SystemExit('Expected rtrs 0.2.4; stop rather than building a different version.')
          PY

      - name: Update old PyO3 binding dependency for Python 3.13
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('Cargo.toml')
          data = path.read_text(encoding='utf-8')
          old = 'pyo3 = { version = "0.18", optional = true, features = ["extension-module"] }'
          new = 'pyo3 = { version = "0.22", optional = true, features = ["extension-module", "gil-refs"] }'
          if old not in data:
              raise SystemExit('PyO3 dependency line changed upstream; manual review needed.')
          path.write_text(data.replace(old, new), encoding='utf-8')
          print('Temporarily use PyO3 0.22 with legacy gil-refs support for CPython 3.13.')
          PY

      - name: Build manylinux x86_64 CPython 3.13 wheel
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          manylinux: auto
          args: --release --out dist --features python -i python3.13

      - name: Set up Python 3.13 for import check
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Smoke test Python import
        run: |
          python -m pip install --no-deps dist/*.whl
          python -c "import rtrs; assert callable(rtrs.run_simulation); print('rtrs imported OK on Python 3.13')"

      - name: Upload compiled wheel
        uses: actions/upload-artifact@v4
        with:
          name: rtrs-0.2.4-linux-cp313-x86_64
          path: dist/*.whl
          if-no-files-found: error
